name: Bug report
description: Something in the build pipeline is not working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include the command you ran and your Node
        version — those two things resolve most issues immediately.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
      placeholder: "`npm run build` finished but dist/css/style.css was empty."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1. `npm install`
        2. `npm run ...`
        3. ...
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Which command?
      options:
        - npm run dev
        - npm run build
        - npm run zip
        - npm run deploy
        - npm run lint / format
        - Other
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v22.11.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.2 / Ubuntu 24.04 / Windows 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Paste the full output. This is automatically formatted as code.
      render: shell
