name: Feature request
description: Suggest an addition or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project aims to stay a *small*, readable starter. Additions that
        every user would want are a better fit than ones serving a single
        workflow — but suggest it anyway and let's talk.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "I keep having to hand-write ... every time I start a project."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
