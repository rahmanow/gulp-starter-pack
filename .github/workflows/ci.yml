name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          [ -f build/index.html ]     || fail "build/index.html was not produced"
          [ -f build/css/style.css ]  || fail "build/css/style.css was not produced"
          [ -f build/js/main.js ]     || fail "build/js/main.js was not produced"

          # A stylesheet that exists but is empty is the 1.x bug this guards against.
          [ -s build/css/style.css ]  || fail "build/css/style.css is empty"

          # Every @@include must have been expanded.
          if grep -q "@@include(" build/index.html; then
            fail "unprocessed @@include directive left in build/index.html"
          fi

          # Partials are fragments and must never be emitted as pages.
          if [ -e build/partials ]; then
            fail "partials leaked into the production build"
          fi

          # The output must be a complete HTML document.
          grep -qi "<html"  build/index.html || fail "no <html> element in build/index.html"
          grep -qi "</body>" build/index.html || fail "no </body> element in build/index.html"

          echo "Build output verified."

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Informational: the known browser-sync advisories are documented in
      # SECURITY.md, so this reports without failing the build.
      - name: npm audit
        run: npm audit --audit-level=high || true
